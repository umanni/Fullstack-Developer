# Local development services. Start with: docker compose up -d
# Provides PostgreSQL for the Rails app without installing Postgres locally.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fullstack_developer
      POSTGRES_PASSWORD: fullstack_developer
      POSTGRES_DB: fullstack_developer_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullstack_developer"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    ports:
      - "8000:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: postgres://fullstack_developer:fullstack_developer@db:5432/fullstack_developer_development
      CACHE_DATABASE_URL: postgres://fullstack_developer:fullstack_developer@db:5432/fullstack_developer_cache
      QUEUE_DATABASE_URL: postgres://fullstack_developer:fullstack_developer@db:5432/fullstack_developer_queue
      CABLE_DATABASE_URL: postgres://fullstack_developer:fullstack_developer@db:5432/fullstack_developer_cable
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
