name: umanni-users

x-app: &app
  build:
    context: .
    args:
      RUBY_VERSION: 4.0.6
  environment: &app-environment
    RAILS_ENV: production
    DB_HOST: database
    DB_PORT: 5432
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-compose-secret-key-base-that-must-never-be-used-in-production}
    APP_HOST: ${APP_HOST:-localhost}
    APP_PROTOCOL: ${APP_PROTOCOL:-http}
  depends_on:
    database:
      condition: service_healthy
  volumes:
    - storage:/rails/storage

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres:/var/lib/postgresql/data

  setup:
    <<: *app
    command: ["./bin/rails", "db:prepare"]

  web:
    <<: *app
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3000:80"

  jobs:
    <<: *app
    command: ["./bin/jobs"]
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  test:
    profiles: ["tools"]
    build:
      context: .
      target: development
      args:
        RUBY_VERSION: 4.0.6
    environment:
      RAILS_ENV: test
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CHROME_BIN: /usr/bin/chromium
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/rails
    command: ["./bin/ci"]

volumes:
  postgres:
  storage:

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-198.18.113.0/24}
