# Strict house style. The omakase preset was deliberately dropped in favour of
# an explicit rule set: every relaxation below is listed with its reason, so
# the configuration documents the trade-offs instead of hiding them.

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-performance

AllCops:
  NewCops: enable
  DisplayCopNames: true
  DisplayStyleGuide: true
  Exclude:
    - "db/schema.rb"
    - "db/*_schema.rb"
    # Migrations copied verbatim from the framework gems are not ours to style.
    - "db/migrate/*_solid_*.rb"
    - "db/migrate/*.active_storage.rb"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"
    - "bin/bundle"

# ── Layout ───────────────────────────────────────────────────────────────────
Layout/LineLength:
  Max: 120

# ── Style ────────────────────────────────────────────────────────────────────
Style/Documentation:
  # Class names and method names carry the intent here; mandatory top-of-class
  # comments would add ceremony without adding information.
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  # Ruby 4 freezes string literals in files without the magic comment under
  # the chilled-strings behaviour, so the annotation is noise.
  Enabled: false

# ── Metrics ──────────────────────────────────────────────────────────────────
# Kept enabled on purpose: these are the cops that keep methods small.
Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context
    - shared_examples
    - configure
    - draw

Metrics/MethodLength:
  Max: 15
  Exclude:
    # A create_table with a dozen columns is one declaration, not a long
    # method. Splitting it to satisfy a line count would make it worse.
    - "db/migrate/*.rb"

Metrics/AbcSize:
  Max: 20

# ── Rails ────────────────────────────────────────────────────────────────────
Rails/DynamicFindBy:
  # find_by_password_reset_token! is not a dynamic column finder: it is
  # generated by generates_token_for, and rewriting it into
  # find_by!(password_reset_token: ...) looks for a column that does not exist.
  # Autocorrect made exactly that change and broke the password reset flow.
  AllowedMethods:
    - find_by_password_reset_token!
    - find_by_password_reset_token

Rails/SkipsModelValidations:
  # Import counters are advanced with atomic updates on purpose; validating a
  # counter bump on every row would serialise the import for no benefit.
  AllowedMethods:
    - increment!
    - update_columns
    - touch

# ── RSpec ────────────────────────────────────────────────────────────────────
RSpec/ExampleLength:
  Max: 12
  Exclude:
    # System specs walk a whole journey; splitting one into five examples would
    # mean re-driving the browser five times to assert the same thing once.
    - "spec/system/**/*_spec.rb"

RSpec/MultipleExpectations:
  # A request spec legitimately asserts on status, redirect and side effect.
  Max: 4

RSpec/NestedGroups:
  Max: 4

# ── Screenshot helper ────────────────────────────────────────────────────────
# spec/system/screenshots_spec.rb produces the README images. save_screenshot is
# the entire point of that file; treating it as a stray debugging call is the
# right default everywhere else.
Lint/Debugger:
  Exclude:
    - "spec/system/screenshots_spec.rb"

