# Omakase Ruby styling for Rails, with stricter additions for this project.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rails
  - rubocop-minitest
  - rubocop-performance

AllCops:
  NewCops: enable
  Exclude:
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "bin/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "storage/**/*"

Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '\A\s*#'

Metrics/MethodLength:
  Max: 25

Metrics/ClassLength:
  Max: 150

Metrics/AbcSize:
  Max: 30

Style/Documentation:
  Enabled: false

Rails/I18nLocaleTexts:
  Enabled: false

Minitest/MultipleAssertions:
  Max: 8
