name: CodeQL

on:
  push:
    branches: [master, feature/senior-user-management]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 7 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ruby
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
