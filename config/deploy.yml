# Name of your application. Used to uniquely configure containers.
service: umanni_users

# Name of the container image (use your-user/app-name on external registries).
image: umanni_users

# Deploy to these servers.
servers:
  web:
    - 192.168.0.1
  job:
    hosts:
      - 192.168.0.1
    cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# production.rb enables assume_ssl + force_ssl (with /up excluded) for this proxy setup.
#
# Uncomment and set your hostname before the first deploy:
# proxy:
#   ssl: true
#   host: users.example.com
#   app_port: 80

# Where you keep your container images.
registry:
  server: localhost:5555
  # username: your-user
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Prefer dedicated job containers above. Keep true for single-box demos.
    SOLID_QUEUE_IN_PUMA: false
    # Optional Ruby 4 ZJIT (MRI experimental) — enable on compatible hosts.
    # RUBYOPT: "--zjit"

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent SQLite + Active Storage volume.
volumes:
  - "umanni_users_storage:/rails/storage"

# Bridge fingerprinted assets between versions.
asset_path: /rails/public/assets

# Configure the image builder (Thruster is the default CMD in Dockerfile).
builder:
  arch: amd64

# accessories: none required — Solid Cable/Queue/Cache replace Redis.
