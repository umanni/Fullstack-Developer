# Kamal 2 production deployment for the Thruster-backed Rails image.
# Put WEB_HOST, DB_HOST and secrets in .kamal/secrets (never in this file).
service: peoplehub
image: umanni/peoplehub

servers:
  web:
    hosts:
      - <%= ENV.fetch("WEB_HOST") %>
  workers:
    hosts:
      - <%= ENV.fetch("WEB_HOST") %>
    cmd: bin/jobs

proxy:
  host: <%= ENV.fetch("APP_HOST") %>
  ssl: true
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "replace-me") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_ENV: production
    APP_PROTOCOL: https
    ACTIVE_STORAGE_SERVICE: amazon
    RAILS_LOG_TO_STDOUT: "1"
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - AWS_BUCKET

asset_path: /rails/public/vite

builder:
  arch: amd64

accessories:
  postgres:
    image: postgres:17-alpine
    host: <%= ENV.fetch("DB_HOST") %>
    cmd: postgres -c wal_level=replica -c fsync=on -c synchronous_commit=on
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: user_management_production
        POSTGRES_USER: user_management
      secret:
        - POSTGRES_PASSWORD
    directories:
      - postgres_data:/var/lib/postgresql/data
