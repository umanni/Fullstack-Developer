# Fake server for `bin/kamal <command> -d local` (see config/deploy.local.yml).
#
#   ssh-keygen -t ed25519 -N "" -f .kamal/local/ssh/id_ed25519   # once
#   docker compose -f .kamal/local/compose.yml up -d --build
#   docker compose -f .kamal/local/compose.yml down -v             # wipe the server
name: umanni-users-kamal-local

services:
  server:
    build: .
    privileged: true
    hostname: kamal-local
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
    volumes:
      - ./ssh/id_ed25519.pub:/keys/authorized_keys:ro
      # Persist containers and Kamal's host directories (e.g. postgres data) across restarts.
      - docker-data:/var/lib/docker
      - root-home:/root

volumes:
  docker-data:
  root-home:
